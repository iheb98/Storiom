<mat-toolbar color="primary" fixedInViewport="true">
    <mat-toolbar-row>
        <button mat-button (click)="opened = !opened"><mat-icon>menu</mat-icon></button>
        <span class="navbar-fill-remaining-space"></span>
        <span class="connected-user" title="{{connectedUser?.firstName}}" *ngIf="connectedUser">
            <span class="user-icon">
                <fa-icon [icon]="userIcon"></fa-icon>
            </span>
            {{connectedUser?.firstName}}
        </span>
    </mat-toolbar-row>
</mat-toolbar>
<mat-sidenav-container>
    <mat-sidenav [(opened)]="opened">
        <mat-list>
            <mat-list-item *ngFor="let item of menu">
                <a [routerLink]="['/' + item.link]" routerLinkActive="router-link-active">
                    <button mat-button>
                        <fa-icon [icon]="item.icon"></fa-icon>
                        {{item?.label}}
                    </button>
                </a>
            </mat-list-item>
            <mat-list-item>
                <a>
                    <button mat-button (click)="logout()">
                        <fa-icon [icon]="powerIcon"></fa-icon>
                        Log out
                    </button>
                </a>
            </mat-list-item>
        </mat-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <div class="full-page">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
