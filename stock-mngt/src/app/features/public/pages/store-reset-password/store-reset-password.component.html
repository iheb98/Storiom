<div class="store-auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Nouveau mot de passe</h1>
      <p>Choisissez un nouveau mot de passe pour votre compte</p>
    </div>

    <div class="auth-error" *ngIf="errorMessage">
      <span>{{ errorMessage }}</span>
    </div>

    <div class="auth-success" *ngIf="successMessage">
      <span>{{ successMessage }}</span>
      <div style="text-align: center; margin-top: 16px;">
        <a [routerLink]="[basePath, 'login']" class="submit-btn" style="display: inline-flex; text-decoration: none; width: auto; padding: 12px 24px;">
          Se connecter <fa-icon [icon]="faArrowRight"></fa-icon>
        </a>
      </div>
    </div>

    <form (ngSubmit)="submit()" class="auth-form" *ngIf="!successMessage">
      <div class="form-group">
        <label for="newPassword">
          <fa-icon [icon]="faLock"></fa-icon> Nouveau mot de passe
        </label>
        <div class="password-input">
          <input [type]="showPassword ? 'text' : 'password'" id="newPassword"
                 [(ngModel)]="newPassword" name="newPassword"
                 placeholder="Au moins 6 caractères" autocomplete="new-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          <fa-icon [icon]="faLock"></fa-icon> Confirmer le mot de passe
        </label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword"
               name="confirmPassword" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Réinitialiser <fa-icon [icon]="faArrowRight"></fa-icon></span>
        <span *ngIf="isLoading">Réinitialisation...</span>
      </button>
    </form>
  </div>
</div>
