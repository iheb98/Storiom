<div class="cart-container">

  <!-- LEFT SIDE – CART ITEMS -->
  <div class="cart-items">

    <h2>Votre Panier</h2>

    <div *ngIf="cart.length === 0" class="empty">
      Votre panier est vide.
    </div>

    <div *ngFor="let item of cart" class="cart-item">

      <div class="img">
        <img
          [src]="item?.product?.images?.length ? environment.backend + '/' + item?.product?.images[0] : 'assets/default_product.png'"
          alt="product" />
      </div>

      <div class="details">
        <h3>{{ item.product.name }}</h3>
        <p class="price">{{ item.product.sellingPrice }} TND</p>

        <div class="quantity">
          <button (click)="decreaseQty(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQty(item)">+</button>
        </div>

        <button class="remove" (click)="removeItem(item)">Supprimer</button>
      </div>
    </div>

  </div>

  <!-- RIGHT SIDE – ORDER SUMMARY -->
  <div class="cart-summary">
    <div class="box">
      <p class="total-text">Sous-total ({{ totalItems }} articles) :</p>
      <p class="total">{{ totalPrice }} TND</p>

      <button class="checkout-btn" (click)="checkout()">
        Passer la commande
      </button>
    </div>
  </div>

</div>
