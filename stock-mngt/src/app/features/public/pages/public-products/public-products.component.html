<div class="products-page-container">

    <!-- HEADER -->
    <header class="products-header">
        <h1 *ngIf="category">{{ category.name }}</h1>
        <h1 *ngIf="!category && searchQuery">Résultats pour "{{ searchQuery }}"</h1>
        <h1 *ngIf="!category && !searchQuery">Tous les Produits</h1>
    </header>

    <div class="products-content">

        <!-- FILTERS SIDEBAR -->
        <aside class="filters">
            <h3>Filtres</h3>

            <!-- Category Filter -->
            <div class="filter-group">
                <label>Catégorie</label>
                <!-- <select [(ngModel)]="filters.category" (change)="applyFilters()">
                    <option value="">All Categories</option>
                    <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                </select> -->

                <ng-select [(ngModel)]="filters.category" name="category" id="category">
                    <ng-option value="">Toutes les Catégories</ng-option>
                    <ng-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</ng-option>
                </ng-select>
            </div>

            <!-- Price Filter -->
            <div class="filter-group">
                <label>Fourchette de Prix</label>
                <input type="number" placeholder="Min" [(ngModel)]="filters.minPrice">
                <input type="number" placeholder="Max" [(ngModel)]="filters.maxPrice">
            </div>

            <!-- Store Filter -->
            <div class="filter-group">
                <label>Magasin</label>
                <!-- <select [(ngModel)]="filters.store" (change)="applyFilters()">
                    <option value="">All Stores</option>
                    <option *ngFor="let store of stores" [value]="store.id">{{ store.name }}</option>
                </select> -->

                <ng-select [(ngModel)]="filters.store" name="store" id="store">
                    <ng-option *ngFor="let store of stores" [value]="store.id">{{store.name}}</ng-option>
                </ng-select>
            </div>

            <!-- Sort -->
            <div class="filter-group">
                <label>Trier Par</label>
                <!-- <select [(ngModel)]="filters.sort" (change)="applyFilters()">
                    <option value="priceAsc">Price: Low to High</option>
                    <option value="priceDesc">Price: High to Low</option>
                    <option value="latest">Latest</option>
                </select> -->

                <ng-select [(ngModel)]="filters.sort" name="sort" id="sort">
                    <ng-option value="priceAsc">Prix : Croissant</ng-option>
                    <ng-option value="priceDesc">Prix : Décroissant</ng-option>
                    <ng-option value="latest">Plus Récents</ng-option>
                </ng-select>
            </div>

            <button class="apply-filters-btn" (click)="applyFilters()">Appliquer</button>
            <button class="reset-filters-btn" (click)="resetFilters()">Réinitialiser</button>

        </aside>

        <!-- PRODUCTS GRID -->
        <main class="products-grid">
            <div *ngIf="products.length === 0" class="no-products">Aucun produit trouvé.</div>

            <app-product-card *ngFor="let product of products" [product]="product">
            </app-product-card>


            <!-- PAGINATION -->
            <mat-paginator [length]="count" [pageSize]="currentSize" [pageSizeOptions]="[12,24,48]"
                (page)="handlePageEvent($event)" [pageIndex]="currentPage">
            </mat-paginator>
        </main>

    </div>
</div>
