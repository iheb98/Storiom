<div class="store-auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Connexion</h1>
      <p>Connectez-vous à votre compte {{ storeName }}</p>
    </div>

    <div class="auth-error" *ngIf="errorMessage">
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <label for="email">
          <fa-icon [icon]="faEnvelope"></fa-icon> Email
        </label>
        <input type="email" id="email" [(ngModel)]="email" name="email"
               placeholder="votre@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">
          <fa-icon [icon]="faLock"></fa-icon> Mot de passe
        </label>
        <div class="password-input">
          <input [type]="showPassword ? 'text' : 'password'" id="password"
                 [(ngModel)]="password" name="password"
                 placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <a [routerLink]="[basePath, 'forgot-password']" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter <fa-icon [icon]="faArrowRight"></fa-icon></span>
        <span *ngIf="isLoading">Connexion...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ? <a [routerLink]="[basePath, 'register']">Créer un compte</a></p>
    </div>
  </div>
</div>
