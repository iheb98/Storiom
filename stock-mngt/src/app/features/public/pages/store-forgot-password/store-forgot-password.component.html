<div class="store-auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Mot de passe oublié</h1>
      <p>Entrez votre email pour recevoir un lien de réinitialisation</p>
    </div>

    <div class="auth-error" *ngIf="errorMessage">
      <span>{{ errorMessage }}</span>
    </div>

    <div class="auth-success" *ngIf="successMessage">
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="submit()" class="auth-form" *ngIf="!successMessage">
      <div class="form-group">
        <label for="email">
          <fa-icon [icon]="faEnvelope"></fa-icon> Email
        </label>
        <input type="email" id="email" [(ngModel)]="email" name="email"
               placeholder="votre@email.com" autocomplete="email">
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Envoyer le lien <fa-icon [icon]="faArrowRight"></fa-icon></span>
        <span *ngIf="isLoading">Envoi...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p><a [routerLink]="[basePath, 'login']"><fa-icon [icon]="faArrowLeft"></fa-icon> Retour à la connexion</a></p>
    </div>
  </div>
</div>
