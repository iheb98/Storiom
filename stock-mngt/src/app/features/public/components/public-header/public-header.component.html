<!-- Full-screen overlay for closing menu -->
<div class="overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">
            <a routerLink="/">Storiom</a>
        </div>

        <div class="mobile-header-actions">
            <button class="menu-toggle" (click)="toggleMenu()">
                <fa-icon [icon]="menuIcon"></fa-icon>
            </button>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Rechercher des produits uniques..." [(ngModel)]="searchText"
                (keyup.enter)="onSearch()">
            <button (click)="onSearch()">
                <fa-icon [icon]="searchIcon"></fa-icon>
            </button>
        </div>

        <div class="navbar-links" [class.open]="isMenuOpen">
            <a routerLink="/publicProducts" routerLinkActive="active" (click)="closeMenu()">Produits</a>
            <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
            <a routerLink="/stores" routerLinkActive="active" (click)="closeMenu()">Boutiques</a>
            <a (click)="goToSellerSpace()" class="seller-link" [class.active]="isSellerActive()">Espace Vendeur</a>

            <div class="icon-links">
                <a (click)="goToCart(); closeMenu()" class="nav-icon" title="Panier">
                    <fa-icon [icon]="cartIcon"></fa-icon>
                    <span class="link-text">Panier</span>
                    <!-- <span class="badge">2</span> -->
                </a>
                <a (click)="goToProfile(); closeMenu()" class="nav-icon" title="Compte">
                    <fa-icon [icon]="userIcon"></fa-icon>
                    <span class="link-text">Compte</span>
                </a>
            </div>
        </div>
    </div>
</nav>
