<div class="category-dialog">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <div class="header-icon">
      <i class="fa fa-folder"></i>
    </div>
    <div class="header-text">
      <h2>{{ data?.name ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</h2>
      <p>{{ data?.name ? 'Modifiez les informations de cette catégorie' : 'Ajoutez une nouvelle catégorie à votre
        arborescence' }}</p>
    </div>
    <button class="close-btn" (click)="onNoClick()" [disabled]="isUploading">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <!-- Dialog Content -->
  <div class="dialog-content">
    <div class="form-group">
      <label for="categoryName">
        <i class="fa fa-folder-open"></i> Nom de la catégorie *
      </label>
      <input type="text" id="categoryName" [(ngModel)]="categoryData.name"
        placeholder="Ex: Électronique, Vêtements, Alimentation..." autofocus>
    </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button class="btn-cancel" (click)="onNoClick()" [disabled]="isUploading">Annuler</button>
    <button class="btn-submit" (click)="submit()" [disabled]="!categoryData.name || isUploading">
      <span *ngIf="!isUploading">
        <i class="fa" [class.fa-plus]="!data?.name" [class.fa-save]="data?.name"></i>
        {{ data?.name ? 'Enregistrer' : 'Ajouter' }}
      </span>
      <span *ngIf="isUploading">
        <i class="fa fa-spinner fa-spin"></i>
        Téléchargement...
      </span>
    </button>
  </div>
</div>
