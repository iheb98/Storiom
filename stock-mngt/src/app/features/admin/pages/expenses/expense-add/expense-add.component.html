<div class="expense-form-page">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-nav"></div>
        <div class="skeleton-header"></div>
        <div class="skeleton-form"></div>
    </div>

    <!-- Submitting Overlay -->
    <div class="action-overlay" *ngIf="isSubmitting">
        <div class="action-spinner">
            <div class="spinner"></div>
            <span>Enregistrement en cours...</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Page Header -->
        <header class="page-header">
            <a class="back-link" (click)="navigateTo('/expenses')">
                <fa-icon [icon]="faArrowLeft"></fa-icon>
                <span>Retour aux dépenses</span>
            </a>
            <div class="header-row">
                <div class="header-icon">
                    <fa-icon [icon]="faReceipt"></fa-icon>
                </div>
                <h1>{{ expenseId ? 'Modifier' : 'Ajouter' }} une dépense</h1>
            </div>
        </header>

        <form [formGroup]="form" (ngSubmit)="expenseId ? edit() : create()">
            <div class="form-card">
                <!-- Expense Info Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faReceipt"></fa-icon> Informations de la dépense</h3>

                    <div class="form-group">
                        <label for="title">
                            <fa-icon [icon]="faTag"></fa-icon> Titre <span class="required">*</span>
                        </label>
                        <input type="text" id="title" formControlName="title"
                            placeholder="Ex: Loyer, Électricité, Fournitures..."
                            [class.invalid]="submitted && !form.get('title').value">
                        <span class="error-message" *ngIf="submitted && !form.get('title').value">
                            Le titre est obligatoire
                        </span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">
                                <fa-icon [icon]="faCoins"></fa-icon> Montant <span class="required">*</span>
                            </label>
                            <div class="input-with-suffix">
                                <input type="number" id="amount" formControlName="amount" placeholder="0.00"
                                    [class.invalid]="submitted && !form.get('amount').value">
                                <span class="suffix">DT</span>
                            </div>
                            <span class="error-message" *ngIf="submitted && !form.get('amount').value">
                                Le montant est obligatoire
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="date"><fa-icon [icon]="faCalendarAlt"></fa-icon> Date</label>
                            <input type="date" id="date" formControlName="date">
                        </div>
                    </div>
                </div>

                <!-- Comment Section -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="comment"><fa-icon [icon]="faComment"></fa-icon> Commentaire / Notes</label>
                        <textarea id="comment" formControlName="comment" rows="4"
                            placeholder="Ajoutez des notes ou détails sur cette dépense..."></textarea>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" (click)="navigateTo('/expenses')">Annuler</button>
                    <button type="submit" class="btn-submit" [disabled]="isSubmitting">
                        <fa-icon [icon]="expenseId ? faSave : faPlus"></fa-icon>
                        {{ isSubmitting ? 'Enregistrement...' : (expenseId ? 'Enregistrer les modifications' : 'Ajouter
                        la dépense') }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
