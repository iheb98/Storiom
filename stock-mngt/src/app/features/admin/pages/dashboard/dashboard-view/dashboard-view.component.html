<div class="padding-page">
    <div class="row">
        <div class="col-12 title-bloc">
            <h3 class="title">Dashboard</h3>
        </div>
    </div>

    <div class="row widget-container g-3 m-3">
        <div class="col-3 col-sm-6 col-md-4 col-lg-3 widget" *ngFor="let w of widgetsList">
            <div class="content d-flex align-items-center gap-3 p-3 shadow-sm rounded">
                <div class="icon-box" [ngClass]="w.class">
                    <fa-icon [icon]="w.icon"></fa-icon>
                </div>
                <div class="value-box">
                    <div class="label text-muted small">
                        {{ w.label }}
                    </div>
                    <div class="value">
                        {{ w.value }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-12 fixed-height">
            <div class="row">
                <div class="col-12">
                    <span class="subtitle">Détails sur les Catégories</span>
                </div>
                <div class="col-12">
                    <app-parent-categories-stats></app-parent-categories-stats>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-6 fixed-height">
            <div class="row">
                <div class="col-12">
                    <span class="subtitle">Dernieres Factures</span>
                </div>
                <div class="col-12">
                    <app-receipt-result-table></app-receipt-result-table>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 fixed-height">
            <div class="row">
                <div class="col-12">
                    <span class="subtitle">Produits avec stock ciritque</span>
                </div>
                <div class="col-12">
                    <app-product-result-table></app-product-result-table>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6 fixed-height">
                <div class="row">
                    <div class="col-12">
                        <span class="subtitle">Produits les plus vendues</span>
                    </div>
                    <app-most-sold-products></app-most-sold-products>
                </div>
            </div>
            <div class="col-12 col-md-6 fixed-height">
                <div class="row">
                    <div class="col-12">
                        <span class="subtitle">Produits les plus profitable</span>
                    </div>
                    <app-most-profitable-products></app-most-profitable-products>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <h3>Statistiques sur les operations</h3>
            </div>
            <div class="col-12 col-md-12">
                <app-operation-stats></app-operation-stats>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-12">
                <h3>Statistiques sur les catégories</h3>
            </div>
            <div class="col-12 col-md-12">
                <app-category-stats></app-category-stats>
            </div>
        </div>
    </div>
</div>
