<div class="operation-stats-container">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-legend"></div>
        <div class="skeleton-chart"></div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Legend -->
        <div class="chart-legend">
            <div class="legend-item sold">
                <span class="legend-color"></span>
                <span class="legend-label">Ventes</span>
            </div>
            <div class="legend-item loaded">
                <span class="legend-color"></span>
                <span class="legend-label">Approvisionnements</span>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="chart-wrapper">
            <p-chart type="bar" [data]="operationsData" [options]="operationsOptions"></p-chart>
        </div>
    </div>
</div>
