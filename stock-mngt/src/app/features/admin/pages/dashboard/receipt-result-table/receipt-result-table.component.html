<div class="receipts-container">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5]"></div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Receipts List -->
        <div class="receipts-list" *ngIf="receipts?.length > 0">
            <div class="receipt-item" *ngFor="let receipt of receipts">
                <div class="receipt-type" [class.sale]="receipt?.type === 'SOLD'"
                    [class.load]="receipt?.type === 'LOADED'">
                    <fa-icon [icon]="receipt?.type === 'SOLD' ? faShoppingCart : faTruck"></fa-icon>
                </div>

                <div class="receipt-info">
                    <div class="receipt-header">
                        <span class="receipt-code">#{{ receipt?.code }}</span>
                        <span class="receipt-badge" [class.sale]="receipt?.type === 'SOLD'"
                            [class.load]="receipt?.type === 'LOADED'">
                            {{ receipt?.type === 'LOADED' ? 'Chargement' : 'Vente' }}
                        </span>
                    </div>
                    <div class="receipt-details">
                        <span class="receipt-name">
                            <fa-icon [icon]="faUser"></fa-icon> {{ receipt?.name || 'Client anonyme' }}
                        </span>
                        <span class="receipt-date">
                            <fa-icon [icon]="faClock"></fa-icon> {{ receipt?.date | date:'dd/MM/yyyy HH:mm' }}
                        </span>
                    </div>
                </div>

                <div class="receipt-total" [class.sale]="receipt?.type === 'SOLD'"
                    [class.load]="receipt?.type === 'LOADED'">
                    <span class="total-value">{{ receipt?.total | number:'1.2-2' }}</span>
                    <span class="total-currency">DT</span>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="receipts?.length === 0">
            <fa-icon [icon]="faReceipt"></fa-icon>
            <h4>Aucune facture récente</h4>
            <p>Vos dernières factures apparaîtront ici</p>
        </div>
    </div>
</div>
