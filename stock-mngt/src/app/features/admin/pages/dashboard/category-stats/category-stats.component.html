<div class="category-stats-container">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-charts-row">
            <div class="skeleton-chart"></div>
            <div class="skeleton-chart"></div>
        </div>
        <div class="skeleton-charts-row">
            <div class="skeleton-chart tall"></div>
            <div class="skeleton-chart tall"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Pie Charts Section -->
        <div class="charts-row pie-charts">
            <div class="chart-card">
                <div class="chart-header">
                    <h3><fa-icon [icon]="faChartPie"></fa-icon> Total des ventes</h3>
                    <span class="chart-badge sales">Par catégorie</span>
                </div>
                <div class="chart-body">
                    <p-chart type="pie" [data]="totalSoldData" [options]="pieChartOptions"></p-chart>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3><fa-icon [icon]="faChartPie"></fa-icon> Net des ventes</h3>
                    <span class="chart-badge profit">Bénéfice net</span>
                </div>
                <div class="chart-body">
                    <p-chart type="pie" [data]="totalSoldNetData" [options]="pieChartOptions"></p-chart>
                </div>
            </div>
        </div>

        <!-- Bar Charts Section -->
        <div class="charts-row bar-charts">
            <div class="chart-card">
                <div class="chart-header">
                    <h3><fa-icon [icon]="faCoins"></fa-icon> Catégories les plus rentables</h3>
                </div>
                <div class="chart-body bar-chart-body">
                    <p-chart type="bar" [data]="operationsData" [options]="operationsOptions"></p-chart>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3><fa-icon [icon]="faFire"></fa-icon> Catégories les plus vendues</h3>
                </div>
                <div class="chart-body bar-chart-body">
                    <p-chart type="bar" [data]="operationsItemsData" [options]="operationsOptions"></p-chart>
                </div>
            </div>
        </div>
    </div>
</div>
