<div class="service-requests-stats">
    <div class="charts-grid">
        <!-- Revenue by Service Chart -->
        <div class="chart-card">
            <div class="chart-header">
                <fa-icon [icon]="faCog"></fa-icon>
                <h3>Revenus par Service (Terminés)</h3>
            </div>
            <div class="chart-body">
                <div class="chart-loading" *ngIf="isLoadingRevenue">
                    <div class="skeleton-pie"></div>
                </div>
                <div class="chart-content" *ngIf="!isLoadingRevenue && hasData(revenueChartData)">
                    <p-chart type="pie" [data]="revenueChartData" [options]="pieChartOptions"></p-chart>
                </div>
                <div class="no-data" *ngIf="!isLoadingRevenue && !hasData(revenueChartData)">
                    <fa-icon [icon]="faCog"></fa-icon>
                    <p>Aucune donnée disponible</p>
                </div>
            </div>
        </div>

        <!-- Requests by Status Chart -->
        <div class="chart-card">
            <div class="chart-header">
                <fa-icon [icon]="faClipboardList"></fa-icon>
                <h3>Demandes par Statut</h3>
            </div>
            <div class="chart-body">
                <div class="chart-loading" *ngIf="isLoadingStatus">
                    <div class="skeleton-pie"></div>
                </div>
                <div class="chart-content" *ngIf="!isLoadingStatus && hasData(statusChartData)">
                    <p-chart type="pie" [data]="statusChartData" [options]="pieChartOptions"></p-chart>
                </div>
                <div class="no-data" *ngIf="!isLoadingStatus && !hasData(statusChartData)">
                    <fa-icon [icon]="faClipboardList"></fa-icon>
                    <p>Aucune demande</p>
                </div>
            </div>
        </div>
    </div>
</div>
