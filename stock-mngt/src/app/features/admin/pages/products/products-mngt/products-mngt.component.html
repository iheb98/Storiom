<div class="padding-page">
    <div class="row title-bloc">
        <h2 class="title">
            Gestion des produits
        </h2>
    </div>
    <div class="row d-flex">
        <div class="col-12 mb-3">
            <input type="name" id="form1" class="form-control search-input" placeholder="Rechercher"
                [(ngModel)]="searchable" [ngModelOptions]="{standalone: true}" (keyup)="search()" />
        </div>
    </div>
    <div class="row d-flex">
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary toggle-filters d-flex align-items-center" (click)="toggleFilters()">
                <mat-icon class="me-2">more_vert</mat-icon> Afficher / Masquer les Filtres
            </button>
        </div>
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary add-button d-flex align-items-center" (click)="create()">
                <mat-icon class="me-2">add</mat-icon> Ajouter
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary d-flex align-items-center" (click)="reset()">
                <mat-icon class="me-2">restart_alt</mat-icon> Réinitialiser
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-primary d-flex align-items-center" (click)="filter()">
                <mat-icon class="me-2">search</mat-icon> Filtrer
            </button>
        </div>
    </div>

    <div class="filter-section" [ngClass]="{'collapsed': filtersCollapsed}">

        <div class="row">
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="name" class="form-label">Nom</label>
                <input type="text" class="form-control" id="name" [(ngModel)]="nameFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="description" class="form-label">Description contient</label>
                <input type="text" class="form-control" id="description" [(ngModel)]="descriptionFilter">
            </div>

            <!--<div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="color" class="form-label">Couleur</label>
                <input type="text" class="form-control" id="color" [(ngModel)]="colorFilter">
            </div>-->

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="supplier" class="form-label">Fournisseur</label>
                <ng-select [(ngModel)]="supplierFilter" name="supplier">
                    <ng-option *ngFor="let element of suppliers" [value]="element?.id">{{element.firstName + ' ' +
                        element.lastName}}</ng-option>
                </ng-select>
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="category" class="form-label">Catégorie</label>
                <ng-select [(ngModel)]="categoryFilter" name="category">
                    <ng-option *ngFor="let element of categories" [value]="element?.id">{{element.name }}</ng-option>
                </ng-select>
            </div>
        </div>

        <div class="row">
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="minQuantityFilter" class="form-label">Quantité</label>
                <input type="number" class="form-control amount-input" id="minQuantityFilter"
                    [(ngModel)]="minQuantityFilter" placeholder="De">
                <input type="number" class="form-control amount-input" id="maxQuantityFilter"
                    [(ngModel)]="maxQuantityFilter" placeholder="Jusqu'à">
            </div>
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="minBuyingPriceFilter" class="form-label">Prix d'achat</label>
                <input type="number" class="form-control amount-input" id="minBuyingPriceFilter"
                    [(ngModel)]="minBuyingPriceFilter" placeholder="De">
                <input type="number" class="form-control amount-input" id="maxBuyingPriceFilter"
                    [(ngModel)]="maxBuyingPriceFilter" placeholder="Jusqu'à">
            </div>
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="minSellingPriceFilter" class="form-label">Prix de vente</label>
                <input type="number" class="form-control amount-input" id="minSellingPriceFilter"
                    [(ngModel)]="minSellingPriceFilter" placeholder="De">
                <input type="number" class="form-control amount-input" id="maxSellingPriceFilter"
                    [(ngModel)]="maxSellingPriceFilter" placeholder="Jusqu'à">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-6 col-md-6 col-lg-4 card-container" *ngFor="let item of products">
            <div class="card h-100 d-flex flex-column">
                <!-- Header -->
                <div class="card-header d-flex align-items-center justify-content-between overflow-hidden">
                    <span class="card-title text-truncate flex-grow-1 me-2">{{ item?.name }}</span>
                    <div class="d-flex gap-1 icon-buttons">
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                            (click)="navigateTo('/products/edit/' + item?.id)">
                            <fa-icon [icon]="editIcon" class="icon-sm"></fa-icon>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteProduct(item)">
                            <fa-icon [icon]="deleteIcon" class="icon-sm"></fa-icon>
                        </button>
                    </div>
                </div>

                <!-- Image -->
                <div class="card-body p-0">
                    <img [src]="item?.images[0] ? environment.backend + '/' + item?.images[0] : 'assets/default_product.png'"
                        class="img-fluid w-100 object-fit-cover" style="max-height: 250px" alt="Image"
                        (click)="openImage(item?.images[0] ? environment.backend + '/' + item?.images[0] : 'assets/default_product.png')">
                </div>

                <!-- Footer -->
                <div class="card-footer">
                    <div class="row product-info mb-2">
                        <div class="col-12">
                            <div><label>Catégorie :</label> <span>{{ item?.category?.name || "--" }}</span></div>
                            <div><label>Prix de vente :</label>
                                <span>{{ item?.sellingPrice ? (item.sellingPrice + ' ' + (item.currency || ' DT')) :
                                    '--' }}</span>
                            </div>
                            <div><label>Quantité :</label> <span>{{ item?.quantity || "--" }}</span></div>
                        </div>
                    </div>

                    <!-- Bottom Buttons -->
                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <button type="button" class="btn btn-primary w-100 responsive-button"
                                (click)="consulter(item?.id)">Consulter</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button type="button" class="btn btn-success w-100 responsive-button"
                                (click)="sell(item)">Vendre</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button type="button" class="btn btn-danger w-100 responsive-button"
                                (click)="load(item)">Charger</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <mat-paginator #paginator class="paginator" (page)="handlePageEvent($event)" [length]="count"
                [pageSize]="24" [disabled]="false" [showFirstLastButtons]="true" [pageSizeOptions]="[24,48,100,200]"
                [hidePageSize]="false" [pageIndex]="0" aria-label="Select page">
            </mat-paginator>
        </div>
    </div>
</div>
<div class="image-popup" *ngIf="selectedImage" (click)="closeImage()">
    <img [src]="selectedImage" alt="Zoomed Image">
</div>
