<div class="service-add-page">
    <!-- Page Header -->
    <header class="page-header">
        <button class="btn-back" (click)="goBack()">
            <fa-icon [icon]="faArrowLeft"></fa-icon>
        </button>
        <div class="header-content">
            <div class="header-icon">
                <fa-icon [icon]="faCog"></fa-icon>
            </div>
            <div class="header-text">
                <h1>{{ editMode ? 'Modifier le service' : 'Nouveau service' }}</h1>
                <p>{{ editMode ? 'Modifiez les informations du service' : 'Ajoutez un nouveau service à votre boutique'
                    }}</p>
            </div>
        </div>
    </header>

    <!-- Loading -->
    <div class="loading-overlay" *ngIf="isLoading">
        <div class="spinner"></div>
        <span>Chargement...</span>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="save()" *ngIf="!isLoading" class="service-form">

        <!-- Basic Info Section -->
        <div class="form-section">
            <h3 class="section-title">Informations générales</h3>

            <div class="form-group">
                <label for="name">Nom du service *</label>
                <input type="text" id="name" formControlName="name" placeholder="Ex: Réparation écran iPhone"
                    [class.error]="form.get('name')?.invalid && form.get('name')?.touched">
                <span class="error-text" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
                    Le nom est requis
                </span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" formControlName="description" placeholder="Décrivez le service en détail..."
                    rows="4"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Catégorie</label>
                    <select id="category" formControlName="category">
                        <option *ngFor="let cat of categories" [value]="cat.value">
                            {{ cat.label }}
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estimatedDuration">Durée estimée</label>
                    <input type="text" id="estimatedDuration" formControlName="estimatedDuration"
                        placeholder="Ex: 1-2 heures">
                </div>
            </div>
        </div>

        <!-- Pricing Section -->
        <div class="form-section">
            <h3 class="section-title">Tarification</h3>

            <div class="form-group price-group">
                <label for="price">
                    {{ form.get('isPriceVariable')?.value ? 'Prix de base (DT) *' : 'Prix (DT) *' }}
                </label>
                <div class="price-input">
                    <input type="number" id="price" formControlName="price" min="0" step="0.01"
                        [class.error]="form.get('price')?.invalid && form.get('price')?.touched">
                    <span class="currency">DT</span>
                </div>
                <span class="error-text" *ngIf="form.get('price')?.invalid && form.get('price')?.touched">
                    Le prix doit être positif
                </span>
            </div>

            <div class="toggle-group">
                <label class="toggle-label">
                    <span>Prix variable</span>
                    <p class="toggle-description">Le prix final peut varier selon la prestation (pièces, complexité...)
                    </p>
                </label>
                <div class="toggle-switch" [class.active]="form.get('isPriceVariable')?.value"
                    (click)="form.get('isPriceVariable')?.setValue(!form.get('isPriceVariable')?.value)">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- Status Section -->
        <div class="form-section">
            <h3 class="section-title">Statut</h3>

            <div class="toggle-group">
                <label class="toggle-label">
                    <span>Service actif</span>
                    <p class="toggle-description">Les clients peuvent voir et demander ce service</p>
                </label>
                <div class="toggle-switch" [class.active]="form.get('isActive')?.value"
                    (click)="form.get('isActive')?.setValue(!form.get('isActive')?.value)">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="goBack()">Annuler</button>
            <button type="submit" class="btn-save" [disabled]="isSaving">
                <fa-icon [icon]="faSave" *ngIf="!isSaving"></fa-icon>
                <span class="spinner-small" *ngIf="isSaving"></span>
                {{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
        </div>
    </form>
</div>
