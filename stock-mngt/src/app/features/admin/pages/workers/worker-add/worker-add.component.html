<div class="worker-form-page">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-nav"></div>
        <div class="skeleton-header"></div>
        <div class="skeleton-form"></div>
    </div>

    <!-- Submitting Overlay -->
    <div class="action-overlay" *ngIf="isSubmitting">
        <div class="action-spinner">
            <div class="spinner"></div>
            <span>Enregistrement en cours...</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Page Header -->
        <header class="page-header">
            <a class="back-link" (click)="navigateTo('/workers')">
                <fa-icon [icon]="faArrowLeft"></fa-icon>
                <span>Retour aux travailleurs</span>
            </a>
            <div class="header-row">
                <div class="header-icon">
                    <fa-icon [icon]="faHardHat"></fa-icon>
                </div>
                <h1>{{ workerId ? 'Modifier' : 'Ajouter' }} un travailleur</h1>
            </div>
        </header>

        <form [formGroup]="form" (ngSubmit)="workerId ? edit() : create()">
            <div class="form-card">
                <!-- Personal Info Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faUser"></fa-icon> Informations personnelles</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">
                                <fa-icon [icon]="faUser"></fa-icon> Prénom <span class="required">*</span>
                            </label>
                            <input type="text" id="firstName" formControlName="firstName"
                                placeholder="Entrez le prénom..."
                                [class.invalid]="submitted && !form.get('firstName').value">
                            <span class="error-message" *ngIf="submitted && !form.get('firstName').value">
                                Le prénom est obligatoire
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="lastName">
                                <fa-icon [icon]="faUser"></fa-icon> Nom <span class="required">*</span>
                            </label>
                            <input type="text" id="lastName" formControlName="lastName" placeholder="Entrez le nom..."
                                [class.invalid]="submitted && !form.get('lastName').value">
                            <span class="error-message" *ngIf="submitted && !form.get('lastName').value">
                                Le nom est obligatoire
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Contact Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faAddressBook"></fa-icon> Coordonnées</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email"><fa-icon [icon]="faEnvelope"></fa-icon> Email</label>
                            <input type="email" id="email" formControlName="email" placeholder="exemple@email.com"
                                [class.invalid]="submitted && form.get('email').errors?.pattern">
                            <span class="error-message" *ngIf="submitted && form.get('email').errors?.pattern">
                                Format d'email invalide
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="phone"><fa-icon [icon]="faPhone"></fa-icon> Téléphone</label>
                            <input type="tel" id="phone" formControlName="phone" placeholder="+216 XX XXX XXX">
                        </div>
                    </div>
                </div>

                <!-- Work Info Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faBriefcase"></fa-icon> Informations professionnelles
                    </h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="functionInStore"><fa-icon [icon]="faIdBadge"></fa-icon> Fonction</label>
                            <input type="text" id="functionInStore" formControlName="functionInStore"
                                placeholder="Ex: Vendeur, Caissier...">
                        </div>

                        <div class="form-group">
                            <label for="salary"><fa-icon [icon]="faCoins"></fa-icon> Salaire</label>
                            <div class="input-with-suffix">
                                <input type="number" id="salary" formControlName="salary" placeholder="0.00">
                                <span class="suffix">DT</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="entryDate"><fa-icon [icon]="faCalendarAlt"></fa-icon> Date d'entrée</label>
                        <input type="date" id="entryDate" formControlName="entryDate">
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" (click)="navigateTo('/workers')">Annuler</button>
                    <button type="submit" class="btn-submit" [disabled]="isSubmitting">
                        <fa-icon [icon]="workerId ? faSave : faPlus"></fa-icon>
                        {{ isSubmitting ? 'Enregistrement...' : (workerId ? 'Enregistrer les modifications' : 'Ajouter
                        le travailleur') }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
