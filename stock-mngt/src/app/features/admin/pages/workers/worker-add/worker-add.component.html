<div class="worker-form-page">
    <!-- Page Header -->
    <header class="page-header">
        <a class="back-link" (click)="navigateTo('/workers')">
            <i class="fa fa-arrow-left"></i>
            <span>Retour aux travailleurs</span>
        </a>
        <h1>{{ workerId ? 'Modifier' : 'Ajouter' }} un travailleur</h1>
    </header>

    <form [formGroup]="form" (ngSubmit)="workerId ? edit() : create()">
        <div class="form-card">
            <!-- Personal Info Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fa fa-user"></i> Informations personnelles</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">
                            <i class="fa fa-user"></i> Prénom <span class="required">*</span>
                        </label>
                        <input type="text" id="firstName" formControlName="firstName" placeholder="Entrez le prénom..."
                            [class.invalid]="submitted && !form.get('firstName').value">
                        <span class="error-message" *ngIf="submitted && !form.get('firstName').value">
                            Le prénom est obligatoire
                        </span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">
                            <i class="fa fa-user"></i> Nom <span class="required">*</span>
                        </label>
                        <input type="text" id="lastName" formControlName="lastName" placeholder="Entrez le nom..."
                            [class.invalid]="submitted && !form.get('lastName').value">
                        <span class="error-message" *ngIf="submitted && !form.get('lastName').value">
                            Le nom est obligatoire
                        </span>
                    </div>
                </div>
            </div>

            <!-- Contact Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fa fa-address-book"></i> Coordonnées</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email"><i class="fa fa-envelope"></i> Email</label>
                        <input type="email" id="email" formControlName="email" placeholder="exemple@email.com"
                            [class.invalid]="submitted && form.get('email').errors?.pattern">
                        <span class="error-message" *ngIf="submitted && form.get('email').errors?.pattern">
                            Format d'email invalide
                        </span>
                    </div>

                    <div class="form-group">
                        <label for="phone"><i class="fa fa-phone"></i> Téléphone</label>
                        <input type="tel" id="phone" formControlName="phone" placeholder="+216 XX XXX XXX">
                    </div>
                </div>
            </div>

            <!-- Work Info Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fa fa-briefcase"></i> Informations professionnelles</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="functionInStore"><i class="fa fa-id-badge"></i> Fonction</label>
                        <input type="text" id="functionInStore" formControlName="functionInStore"
                            placeholder="Ex: Vendeur, Caissier...">
                    </div>

                    <div class="form-group">
                        <label for="salary"><i class="fa fa-coins"></i> Salaire</label>
                        <div class="input-with-suffix">
                            <input type="number" id="salary" formControlName="salary" placeholder="0.00">
                            <span class="suffix">DT</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="entryDate"><i class="fa fa-calendar-alt"></i> Date d'entrée</label>
                    <input type="date" id="entryDate" formControlName="entryDate">
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" (click)="navigateTo('/workers')">Annuler</button>
                <button type="submit" class="btn-submit" [disabled]="loading">
                    <i class="fa" [class.fa-plus]="!workerId && !loading" [class.fa-save]="workerId && !loading"
                        [class.fa-spinner]="loading" [class.fa-spin]="loading"></i>
                    {{ loading ? 'Enregistrement...' : (workerId ? 'Enregistrer les modifications' : 'Ajouter le
                    travailleur') }}
                </button>
            </div>
        </div>
    </form>
</div>
