<div class="credit-form-page">

    <!-- Loading Skeleton -->
    <div class="loading-skeleton" *ngIf="isLoading">
        <div class="skeleton-nav"></div>
        <div class="skeleton-header"></div>
        <div class="skeleton-form"></div>
    </div>

    <!-- Submitting Overlay -->
    <div class="action-overlay" *ngIf="isSubmitting">
        <div class="action-spinner">
            <div class="spinner"></div>
            <span>Enregistrement en cours...</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="page-content" *ngIf="!isLoading">

        <!-- Page Header -->
        <header class="page-header">
            <a class="back-link" (click)="navigateTo('/credits')">
                <fa-icon [icon]="faArrowLeft"></fa-icon>
                <span>Retour aux crédits</span>
            </a>
            <div class="header-row">
                <div class="header-icon">
                    <fa-icon [icon]="faHandHoldingUsd"></fa-icon>
                </div>
                <h1>{{ borrowerId ? 'Modifier' : 'Ajouter' }} un crédit</h1>
            </div>
        </header>

        <form [formGroup]="form" (ngSubmit)="borrowerId ? edit() : create()">
            <div class="form-card">
                <!-- Borrower Info Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faUser"></fa-icon> Informations de l'emprunteur</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">
                                <fa-icon [icon]="faUser"></fa-icon> Prénom <span class="required">*</span>
                            </label>
                            <input type="text" id="firstName" formControlName="firstName"
                                placeholder="Entrez le prénom..."
                                [class.invalid]="submitted && !form.get('firstName').value">
                            <span class="error-message" *ngIf="submitted && !form.get('firstName').value">
                                Le prénom est obligatoire
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="lastName">
                                <fa-icon [icon]="faUser"></fa-icon> Nom <span class="required">*</span>
                            </label>
                            <input type="text" id="lastName" formControlName="lastName" placeholder="Entrez le nom..."
                                [class.invalid]="submitted && !form.get('lastName').value">
                            <span class="error-message" *ngIf="submitted && !form.get('lastName').value">
                                Le nom est obligatoire
                            </span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email"><fa-icon [icon]="faEnvelope"></fa-icon> Email</label>
                            <input type="email" id="email" formControlName="email" placeholder="exemple@email.com"
                                [class.invalid]="submitted && form.get('email').errors?.pattern">
                            <span class="error-message" *ngIf="submitted && form.get('email').errors?.pattern">
                                Format d'email invalide
                            </span>
                        </div>

                        <div class="form-group">
                            <label for="phone"><fa-icon [icon]="faPhone"></fa-icon> Téléphone</label>
                            <input type="tel" id="phone" formControlName="phone" placeholder="+216 XX XXX XXX">
                        </div>
                    </div>
                </div>

                <!-- Credit Info Section -->
                <div class="form-section">
                    <h3 class="section-title"><fa-icon [icon]="faHandHoldingUsd"></fa-icon> Informations du crédit</h3>

                    <div class="form-group">
                        <label for="amount"><fa-icon [icon]="faCoins"></fa-icon> Montant</label>
                        <div class="input-with-suffix">
                            <input type="number" id="amount" formControlName="amount" placeholder="0.00">
                            <span class="suffix">DT</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="givenDate"><fa-icon [icon]="faCalendarPlus"></fa-icon> Date de prêt</label>
                            <input type="date" id="givenDate" formControlName="givenDate">
                        </div>

                        <div class="form-group">
                            <label for="returnDate"><fa-icon [icon]="faCalendarCheck"></fa-icon> Date de retour
                                prévue</label>
                            <input type="date" id="returnDate" formControlName="returnDate">
                        </div>
                    </div>
                </div>

                <!-- Comment Section -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="comment"><fa-icon [icon]="faComment"></fa-icon> Commentaire / Notes</label>
                        <textarea id="comment" formControlName="comment" rows="4"
                            placeholder="Ajoutez des notes sur ce crédit..."></textarea>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" (click)="navigateTo('/credits')">Annuler</button>
                    <button type="submit" class="btn-submit" [disabled]="isSubmitting">
                        <fa-icon [icon]="borrowerId ? faSave : faPlus"></fa-icon>
                        {{ isSubmitting ? 'Enregistrement...' : (borrowerId ? 'Enregistrer les modifications' : 'Ajouter
                        le crédit') }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
