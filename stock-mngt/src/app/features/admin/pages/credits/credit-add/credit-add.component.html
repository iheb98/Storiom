<div class="credit-form-page">
    <!-- Page Header -->
    <header class="page-header">
        <a class="back-link" (click)="navigateTo('/credits')">
            <i class="fa fa-arrow-left"></i>
            <span>Retour aux crédits</span>
        </a>
        <h1>{{ borrowerId ? 'Modifier' : 'Ajouter' }} un crédit</h1>
    </header>

    <form [formGroup]="form" (ngSubmit)="borrowerId ? edit() : create()">
        <div class="form-card">
            <!-- Borrower Info Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fa fa-user"></i> Informations de l'emprunteur</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">
                            <i class="fa fa-user"></i> Prénom <span class="required">*</span>
                        </label>
                        <input type="text" id="firstName" formControlName="firstName" placeholder="Entrez le prénom..."
                            [class.invalid]="submitted && !form.get('firstName').value">
                        <span class="error-message" *ngIf="submitted && !form.get('firstName').value">
                            Le prénom est obligatoire
                        </span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">
                            <i class="fa fa-user"></i> Nom <span class="required">*</span>
                        </label>
                        <input type="text" id="lastName" formControlName="lastName" placeholder="Entrez le nom..."
                            [class.invalid]="submitted && !form.get('lastName').value">
                        <span class="error-message" *ngIf="submitted && !form.get('lastName').value">
                            Le nom est obligatoire
                        </span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email"><i class="fa fa-envelope"></i> Email</label>
                        <input type="email" id="email" formControlName="email" placeholder="exemple@email.com"
                            [class.invalid]="submitted && form.get('email').errors?.pattern">
                        <span class="error-message" *ngIf="submitted && form.get('email').errors?.pattern">
                            Format d'email invalide
                        </span>
                    </div>

                    <div class="form-group">
                        <label for="phone"><i class="fa fa-phone"></i> Téléphone</label>
                        <input type="tel" id="phone" formControlName="phone" placeholder="+216 XX XXX XXX">
                    </div>
                </div>
            </div>

            <!-- Credit Info Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fa fa-hand-holding-usd"></i> Informations du crédit</h3>

                <div class="form-group">
                    <label for="amount"><i class="fa fa-coins"></i> Montant</label>
                    <div class="input-with-suffix">
                        <input type="number" id="amount" formControlName="amount" placeholder="0.00">
                        <span class="suffix">DT</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="givenDate"><i class="fa fa-calendar-plus"></i> Date de prêt</label>
                        <input type="date" id="givenDate" formControlName="givenDate">
                    </div>

                    <div class="form-group">
                        <label for="returnDate"><i class="fa fa-calendar-check"></i> Date de retour prévue</label>
                        <input type="date" id="returnDate" formControlName="returnDate">
                    </div>
                </div>
            </div>

            <!-- Comment Section -->
            <div class="form-section">
                <div class="form-group">
                    <label for="comment"><i class="fa fa-comment"></i> Commentaire / Notes</label>
                    <textarea id="comment" formControlName="comment" rows="4"
                        placeholder="Ajoutez des notes sur ce crédit..."></textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" (click)="navigateTo('/credits')">Annuler</button>
                <button type="submit" class="btn-submit" [disabled]="loading">
                    <i class="fa" [class.fa-plus]="!borrowerId && !loading" [class.fa-save]="borrowerId && !loading"
                        [class.fa-spinner]="loading" [class.fa-spin]="loading"></i>
                    {{ loading ? 'Enregistrement...' : (borrowerId ? 'Enregistrer les modifications' : 'Ajouter le
                    crédit') }}
                </button>
            </div>
        </div>
    </form>
</div>
