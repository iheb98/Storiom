<div class="container">
    <div class="row title-bloc">
        <h2 class="title">
            Gestion des produits
        </h2>
    </div>
    <div class="row">
        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="name" class="form-label">Nom</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="nameFilter">
        </div>

        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="quantity" class="form-label">Quantité</label>
            <input type="text" class="form-control" id="quantity" [(ngModel)]="quantityFilter">
        </div>

        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="color" class="form-label">Couleur</label>
            <input type="text" class="form-control" id="color" [(ngModel)]="colorFilter">
        </div>

        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="phone" class="form-label">Fournisseur</label>
            <ng-select [(ngModel)]="supplierFilter" name="supplier">
                <ng-option *ngFor="let element of suppliers" [value]="element">{{element.firstName + ' ' +
                    element.lastName}}</ng-option>
            </ng-select>
        </div>

       
    </div>

    <div class="row">
        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="minBuyingPriceFilter" class="form-label">Prix d'achat</label>
            <input type="number" class="form-control amount-input" id="minBuyingPriceFilter" [(ngModel)]="minBuyingPriceFilter"
                placeholder="De">
            <input type="number" class="form-control amount-input" id="maxBuyingPriceFilter" [(ngModel)]="maxBuyingPriceFilter"
                placeholder="Jusqu'à">
        </div>
        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
            <label for="minSellingPriceFilter" class="form-label">Prix de vente</label>
            <input type="number" class="form-control amount-input" id="minSellingPriceFilter" [(ngModel)]="minSellingPriceFilter"
                placeholder="De">
            <input type="number" class="form-control amount-input" id="maxSellingPriceFilter" [(ngModel)]="maxSellingPriceFilter"
                placeholder="Jusqu'à">
        </div>
    </div>

    <div class="row d-flex justify-content-end">
        <div class="col-12 col-sm-12 col-md-10 col-lg-10 mb-3 align-add-button">
            <button class="btn btn-secondary add-button" (click)="create()">Ajouter</button>
        </div>
        <div class="col-6 col-sm-6 col-md-2 col-lg-1 mb-3 align-filter-button">
            <button class="btn btn-secondary" (click)="reset()">Réinitialiser</button>
        </div>
        <div class="col-6 col-sm-6 col-md-2 col-lg-1 mb-3 align-filter-button">
            <button class="btn btn-primary" (click)="filter()">Filtrer</button>
        </div>
    </div>
</div>
