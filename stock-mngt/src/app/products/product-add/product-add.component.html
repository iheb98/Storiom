<div class="">
    <div class="row actions-bloc d-flex justify-content-start mb-3">
        <!-- Link to Product Management -->
        <div class="col-auto">
            <a (click)="navigateTo('/products')" class="link-no-background text-decoration-none d-flex align-items-center">
                <fa-icon [icon]="arrowLeftIcon" class="me-1"></fa-icon> <!-- Back Arrow -->
                Gestions des Produits
            </a>
        </div>
    
        <!-- Link to View Product if productId exists -->
        <div class="col-auto" *ngIf="productId">
            <a (click)="navigateTo('/products/view/' + product?.id)" class="link-no-background text-decoration-none d-flex align-items-center">
                <fa-icon [icon]="arrowLeftIcon" class="me-1"></fa-icon> <!-- Back Arrow -->
                Consulter
            </a>
        </div>
    </div>
    
    <div class="row screen-title-bloc mb-4">
        <div class="col text-center">
            <h2 class="screen-title">{{ productId ? 'Modifier' : 'Ajouter' }} un produit</h2>
        </div>
    </div>
    <form [formGroup]="form" (ngSubmit)="productId ? update() : create() ">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-12 col-md-12 col-lg-6 login-block">
                <div class="mb-3 row">
                    <label for="name" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Nom</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="text" [ngClass]="{'invalid':submitted && !form.get('name').value}"
                            class="form-control" id="name" formControlName="name">
                        <div *ngIf="submitted && !form.get('name').value" class="form-error">
                            Le nom est obligatoire.
                        </div>
                    </div>
                </div>
                <!--<div class="mb-3 row">
                    <label for="color" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Couleur</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="color" name="color" id="color">
                            <ng-option *ngFor="let element of colors" [value]="element">{{element}}</ng-option>
                        </ng-select>
                    </div>
                </div>-->

                <div class="mb-3 row">
                    <label for="supplier" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Fournisseur</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="supplierId" name="supplier" id="supplier">
                            <ng-option *ngFor="let element of suppliers" [value]="element?.id">{{element.firstName + ' '
                                +
                                element.lastName}}</ng-option>
                        </ng-select>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="brand" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Marque</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="brandId" name="brand" id="brand">
                            <ng-option *ngFor="let element of brands" [value]="element?.id">{{element.name}}</ng-option>
                        </ng-select>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="category" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Catégorie</label>
                    <div class="col-11 col-sm-11 col-md-8 col-lg-8" *ngIf="edit && !editCategory">
                        <input type="text" class="form-control" [(ngModel)]="selectedCategory"
                            [ngModelOptions]="{standalone: true}" disabled>
                    </div>
                    <div class="col-1 col-sm-1 col-md-1 col-lg-1 p-0" *ngIf="edit && !editCategory">
                        <button (click)="editCategory = true" *ngIf="edit && !editCategory" class="edit-category"
                            class="h-100 w-100 p-0"><fa-icon [icon]="editIcon"></fa-icon></button>
                    </div>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9" *ngIf="!edit ||editCategory">
                        <ng-select [(ngModel)]="parentCategory" name="category" id="category"
                            [ngModelOptions]="{standalone: true}" (change)="categoryChanged(0)">
                            <ng-option *ngFor="let element of categories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory" name="category" class="category-field" id="subCategory"
                            *ngIf="parentCategory?.subCategories?.length > 0" [ngModelOptions]="{standalone: true}"
                            (change)="categoryChanged(1)">
                            <ng-option *ngFor="let element of parentCategory?.subCategories"
                                [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory2" name="category" class="category-field" id="subCategory2"
                            *ngIf="subCategory?.subCategories?.length > 0" [ngModelOptions]="{standalone: true}"
                            (change)="categoryChanged(2)">
                            <ng-option *ngFor="let element of subCategory?.subCategories"
                                [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory3" name="category" class="category-field" id="subCategory3"
                            *ngIf="subCategory2?.subCategories?.length > 0" [ngModelOptions]="{standalone: true}"
                            (change)="categoryChanged(3)">
                            <ng-option *ngFor="let element of subCategory2?.subCategories"
                                [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory4" name="category" class="category-field" id="subCategory4"
                            *ngIf="subCategory3?.subCategories?.length > 0" [ngModelOptions]="{standalone: true}">
                            <ng-option *ngFor="let element of subCategory3?.subCategories"
                                [value]="element">{{element.name}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <!--<div class="mb-3 row">
                    <label for="size" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Taille</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="text" class="form-control" id="size" formControlName="size">
                    </div>
                </div>-->
                <div class="mb-3 row">
                    <label for="quantity" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Quantité</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="quantity" formControlName="quantity">
                    </div>
                </div>
                <!--<div class="mb-3 row">
                    <label for="unit" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Unité</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="text" class="form-control" id="unit" formControlName="unit" placeholder="Piece, Litre, Gramme...">
                    </div>
                </div>-->
                <div class="mb-3 row">
                    <label for="buyingPrice" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Prix
                        d'achat</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="buyingPrice" formControlName="buyingPrice">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="sellingPrice" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Prix de
                        vente</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="sellingPrice" formControlName="sellingPrice">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea maxlength="50000" rows="10" resize="none" class="form-control"
                        formControlName="description" id="description">
                    </textarea>
                </div>
                <div class="mb-3">
                    <label for="logo" class="form-label">Images</label>
                    <div class="row images-bloc">
                        <div class="col-4" *ngFor="let item of images">
                            <div class="image-container">
                            <button class="delete-button" (click)="deleteImage(item)"><fa-icon [icon]="timesIcon"></fa-icon></button>
                            <img src="{{environment.backend+'/images/'+item}}" alt="" class="h-100 w-100">
                            </div>
                        </div>
                    </div>
                    <input #fileInput type="file" class="form-control" multiple>
                </div>

                <div class="mb-3 row justify-content-end">
                    <div class="col-12 col-sm-12 col-lg-auto">
                        <button type="submit" class="btn btn-primary full-width" *ngIf="!productId">Ajouter</button>
                        <button type="submit" class="btn btn-primary full-width" *ngIf="productId">Modifier</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
