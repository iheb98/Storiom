<ngx-loading-x [show]="loading" [spinnerColor]="'#683ab7'"></ngx-loading-x>
<div class="container">
    <div class="row title-bloc">
        <h2 class="title">
            {{ supplierId ? 'Modifier' : 'Ajouter'}} un fournisseur
        </h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="supplierId ? edit() : create() ">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-12 col-md-12 col-lg-6 login-block">
                <div class="mb-3 row">
                    <label for="lastName" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Nom</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="text" [ngClass]="{'invalid':submitted && !form.get('lastName').value}"
                            class="form-control" id="lastName" formControlName="lastName">
                        <div *ngIf="submitted && !form.get('lastName').value" class="form-error">
                            Le nom est obligatoire.
                        </div>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="color" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Couleur</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="color" name="color" id="color">
                            <ng-option *ngFor="let element of couleurs" [value]="element">{{element}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="supplier" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Fournisseur</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="supplier" name="supplier" id="supplier">
                            <ng-option *ngFor="let element of suppliers" [value]="element">{{element.firstName + ' ' +
                                element.lastName}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="category" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Catégorie</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select [(ngModel)]="parentCategory" name="category" class="category-field" id="category" [ngModelOptions]="{standalone: true}" (change)="categoryChanged(0)">
                            <ng-option *ngFor="let element of categories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory" name="category" class="category-field" id="subCategory" *ngIf="parentCategory?.subCategories" [ngModelOptions]="{standalone: true}" (change)="categoryChanged(1)">
                            <ng-option *ngFor="let element of parentCategory?.subCategories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory2" name="category" class="category-field" id="subCategory2" *ngIf="subCategory?.subCategories" [ngModelOptions]="{standalone: true}" (change)="categoryChanged(2)">
                            <ng-option *ngFor="let element of subCategory?.subCategories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory3" name="category" class="category-field" id="subCategory3" *ngIf="subCategory2?.subCategories" [ngModelOptions]="{standalone: true}" (change)="categoryChanged(3)">
                            <ng-option *ngFor="let element of subCategory2?.subCategories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>

                        <ng-select [(ngModel)]="subCategory4" name="category" class="category-field" id="subCategory4" *ngIf="subCategory3?.subCategories" [ngModelOptions]="{standalone: true}">
                            <ng-option *ngFor="let element of subCategory3?.subCategories" [value]="element">{{element.name}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="email" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Email</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="email" [ngClass]="{'invalid':submitted && !form.get('email').value || emailError}"
                            class="form-control" id="email" formControlName="email" email="true">
                        <div *ngIf="submitted && form.get('email').errors?.pattern" class="form-error">
                            Mauvaise format d'email
                        </div>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="phone" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Téléphone</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="phone" class="form-control" id="phone" formControlName="phone">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="credit" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Crédit</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="credit" formControlName="credit">
                    </div>
                </div>
                <div class="mb-3 row justify-content-end">
                    <div class="col-12 col-sm-12 col-lg-auto">
                        <button type="submit" class="btn btn-primary full-width" *ngIf="!supplierId">Ajouter</button>
                        <button type="submit" class="btn btn-primary full-width" *ngIf="supplierId">Modifier</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
