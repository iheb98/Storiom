<h1 mat-dialog-title>Entrez la quantité à vendre</h1>

<div mat-dialog-content>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Quantité :</mat-label>
    <input matInput type="number" [(ngModel)]="amount" name="amount">
    <mat-hint *ngIf="amountError" class="text-danger">{{ amountError }}</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Prix :</mat-label>
    <input matInput type="number" [(ngModel)]="price" name="price">
  </mat-form-field>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fermer</button>
  <button mat-button color="primary" (click)="confirm()">
    {{ data.operationType === "SOLD" ? 'Vendre' : 'Charger' }}
  </button>
</div>
