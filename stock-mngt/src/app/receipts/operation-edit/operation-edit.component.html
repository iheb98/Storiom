<ngx-loading-x [show]="loading" [spinnerColor]="'#683ab7'"></ngx-loading-x>
<div class="padding-page">
    <div class="row title-bloc">
        <h2 class="title">
            Modifier une Opération
        </h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="edit()">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-12 col-md-12 col-lg-6 login-block">
                <div class="mb-3 row">
                    <label for="productName" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Produit</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="text" class="form-control" id="productName" formControlName="productName" [disabled]="true" >
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="firstName" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Type</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <ng-select formControlName="type" name="type" id="type">
                            <ng-option *ngFor="let element of types"
                                [value]="element?.value">{{element?.label}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="price" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Prix</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="price" formControlName="price" (change)="calculateTotal()">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="amount" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Quantité</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="amount" formControlName="amount" (change)="calculateTotal()">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="total" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Total</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="number" class="form-control" id="total" formControlName="total">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="date" class="col-12 col-sm-12 col-md-3 col-lg-3 col-form-label">Date</label>
                    <div class="col-12 col-sm-12 col-md-9 col-lg-9">
                        <input type="datetime-local" class="form-control" id="date" formControlName="date">
                    </div>
                </div>
                <div class="mb-3 row justify-content-end">
                    <div class="col-12 col-sm-12 col-lg-auto">
                        <button type="submit" class="btn btn-primary full-width">Modifier</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
