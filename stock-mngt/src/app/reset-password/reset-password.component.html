<div class="container mt-5" *ngIf="!success">
    <h2>Réinitialiser le mot de passe</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="password" class="form-label">Nouveau mot de passe</label>
        <input type="password" class="form-control" id="password" formControlName="password">
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input type="password" class="form-control" id="confirmPassword" formControlName="confirmPassword">
      </div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
      <button type="submit" class="btn btn-primary">Réinitialiser</button>
    </form>
  
    <!-- Retour lien -->
    <div class="mt-3">
      <a routerLink="/login" class="btn btn-link">Retour à la connexion</a>
    </div>
  </div>
  
  <div class="container mt-5" *ngIf="success">
    <div class="alert alert-success">
      Mot de passe réinitialisé avec succès ! Redirection vers la page de connexion...
    </div>
  
    <!-- Optional manual return in case auto-redirect fails -->
    <div class="mt-3">
      <a routerLink="/login" class="btn btn-link">Retour à la connexion</a>
    </div>
  </div>
