<div class="row">
    <div class="col-12 col-md-3 p-2">
        <select class="form-control" [(ngModel)]="selectedDateType" (change)="updateOperationStats()">
            <option *ngFor="let type of typesOfDate" [value]="type">{{type}}</option>
        </select>
    </div>
    <div class="col-12 col-md-9 p-2">
        <input *ngIf="selectedDateType=='DAILY'" class="form-control" type="date" id="day" name="day"
            [(ngModel)]="dayFilter" (change)="updateOperationStats()">

        <input *ngIf="selectedDateType=='WEEKLY'" class="form-control" type="week" id="week" name="week"
            [(ngModel)]="weekFilter" (change)="updateOperationStats()">

        <input *ngIf="selectedDateType=='MONTHLY'" class="form-control" type="month" id="month" name="month"
            [(ngModel)]="monthFilter" (change)="updateOperationStats()">

        <select class="form-control" *ngIf="selectedDateType=='ANNUALLY'" [(ngModel)]="yearFilter"
            (change)="updateOperationStats()">
            <option *ngFor="let year of years" [value]="year">{{year}}</option>
        </select>
    </div>
</div>
<div class="row">
    <div class="col-6 col-md-6">
        <p-chart type="bar" [data]="operationsData" [options]="operationsOptions"></p-chart>
    </div>
    <div class="col-6 col-md-6">
        <p-chart type="bar" [data]="operationsItemsData" [options]="operationsOptions"></p-chart>
    </div>
</div>
