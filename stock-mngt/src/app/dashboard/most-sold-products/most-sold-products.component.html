<div class="row">
    <div class="col-12 table-bloc">
        <table class="table table-responsive table-hover">
            <thead>
                <tr>
                    <th>
                        Nom
                    </th>
                    <th>
                        Prix de vente
                    </th>
                    <th>
                        Quantité Vendue
                    </th>
                    <th>
                        Quantité Encore Disponible
                    </th>

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let operation of operations">
                    <td>
                        {{ operation?.product?.name }}
                    </td>
                    <td>
                        {{ operation?.product?.sellingPrice + " DT" }}
                    </td>
                    <td>
                        {{ operation?.total_amount }}
                    </td>
                    <td>
                        {{ operation?.product?.quantity }}
                    </td>

                </tr>
                <tr *ngIf="operations?.length == 0">
                    <td colspan="4">Pas de resultat trouvé</td>
                </tr>
            </tbody>

        </table>
    </div>
</div>
