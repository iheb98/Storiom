<ngx-loading-x [show]="loading" [spinnerColor]="'#0d6efd'"></ngx-loading-x>
<div class="padding-page">
    <div class="row title-bloc">
        <h3 class="title">Gestion des dépenses</h3>
    </div>

    <div class="row d-flex">
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary toggle-filters d-flex align-items-center" (click)="toggleFilters()">
                <mat-icon class="me-2">more_vert</mat-icon> Afficher / Masquer les Filtres
            </button>
        </div>
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary add-button d-flex align-items-center" (click)="create()">
                <mat-icon class="me-2">add</mat-icon> Ajouter
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary d-flex align-items-center" (click)="reset()">
                <mat-icon class="me-2">restart_alt</mat-icon> Réinitialiser
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-primary d-flex align-items-center" (click)="filter()">
                <mat-icon class="me-2">search</mat-icon> Filtrer
            </button>
        </div>
    </div>


    <div class="filter-section" [ngClass]="{'collapsed': filtersCollapsed}">

        <div class="row">
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="title" class="form-label">Titre</label>
                <input type="text" class="form-control" id="title" [(ngModel)]="titleFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="minAmountFilter" class="form-label">Montant</label>
                <input type="number" class="form-control amount-input" id="minAmountFilter"
                    [(ngModel)]="minAmountFilter" placeholder="De">
                <input type="number" class="form-control amount-input" id="maxAmountFilter"
                    [(ngModel)]="maxAmountFilter" placeholder="Jusqu'à">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="comment" class="form-label">Commentaire</label>
                <input type="text" class="form-control" id="comment" [(ngModel)]="commentFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="fromDateFilter" class="form-label">Date</label>
                <input type="date" class="form-control amount-input" id="fromDateFilter" [(ngModel)]="fromDateFilter"
                    placeholder="De">
                <input type="date" class="form-control amount-input" id="toDateFilter" [(ngModel)]="toDateFilter"
                    placeholder="Jusqu'à">
            </div>
        </div>
    </div>



    <div class="row">
        <div class="col-12 table-bloc">
            <table class="table table-responsive table-hover ">
                <thead>
                    <tr>
                        <th scope="col">Titre</th>
                        <th scope="col">Montant</th>
                        <th scope="col">Commentaire</th>
                        <th scope="col">Date</th>
                        <th scope="col">Modifier</th>
                        <th scope="col">Supprimer</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let expense of expenses">
                        <td>{{expense?.title}}</td>
                        <td>{{expense?.amount + ' DT'}}</td>
                        <td><span class="comment-column">{{expense?.comment}}</span></td>
                        <td>{{expense?.date | date:'shortDate'}}</td>
                        <td>
                            <button class="action-button" (click)="editExpense(expense)"><fa-icon
                                    [icon]="faEdit"></fa-icon></button>
                        </td>
                        <td>
                            <button class="action-button" (click)="deleteExpense(expense)"> <fa-icon
                                    [icon]="faTrash"></fa-icon></button>
                        </td>
                    </tr>
                    <tr *ngIf="count == 0">
                        <td colspan="8" class="not-found-message">Pas de dépense trouvé</td>
                    </tr>
                </tbody>
            </table>

        </div>
        <mat-paginator #paginator class="paginator" (page)="handlePageEvent($event)" [length]="count" [pageSize]="5"
            [disabled]="false" [showFirstLastButtons]="true" [pageSizeOptions]="[5,10,20]" [hidePageSize]="false"
            [pageIndex]="0" aria-label="Select page">
        </mat-paginator>
    </div>
</div>
