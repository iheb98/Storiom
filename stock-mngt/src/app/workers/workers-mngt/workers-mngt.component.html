<ngx-loading-x [show]="loading" [spinnerColor]="'#683ab7'"></ngx-loading-x>
<div class="padding-page">
    <div class="row title-bloc">
        <h3 class="title">Gestion des Travailleurs</h3>
    </div>

    <div class="row d-flex">
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary toggle-filters d-flex align-items-center" (click)="toggleFilters()">
                <mat-icon class="me-2">more_vert</mat-icon> Afficher / Masquer les Filtres
            </button>
        </div>
        <div class="col-12 col-sm-12 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary add-button d-flex align-items-center" (click)="create()">
                <mat-icon class="me-2">add</mat-icon> Ajouter
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-secondary d-flex align-items-center" (click)="reset()">
                <mat-icon class="me-2">restart_alt</mat-icon> Réinitialiser
            </button>
        </div>
        <div class="col-6 col-sm-6 col-md-auto col-lg-auto mb-3">
            <button class="btn btn-primary d-flex align-items-center" (click)="filter()">
                <mat-icon class="me-2">search</mat-icon> Filtrer
            </button>
        </div>
    </div>

    <div class="filter-section" [ngClass]="{'collapsed': filtersCollapsed}">

        <div class="row">
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="firstName" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="firstName" [(ngModel)]="firstNameFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="lastName" class="form-label">Nom</label>
                <input type="text" class="form-control" id="lastName" [(ngModel)]="lastNameFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="phone" class="form-label">Téléphone</label>
                <input type="phone" class="form-control" id="phone" [(ngModel)]="phoneFilter">
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" [(ngModel)]="emailFilter">
            </div>
        </div>

        <div class="row">
            <div class="col-6 col-sm-6 col-md-4 col-lg-3 mb-3">
                <label for="fromEntryDateFilter" class="form-label">Date d'entrée</label>
                <input type="date" class="form-control amount-input" id="fromEntryDateFilter"
                    [(ngModel)]="fromEntryDateFilter" placeholder="De">
                <input type="date" class="form-control amount-input" id="toEntryDateFilter"
                    [(ngModel)]="toEntryDateFilter" placeholder="Jusqu'à">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 table-bloc">
            <table class="table table-responsive table-hover ">
                <thead>
                    <tr>
                        <th scope="col">Prénom</th>
                        <th scope="col">Nom</th>
                        <th scope="col">Email</th>
                        <th scope="col">Téléphone</th>
                        <th scope="col">Date d'entrée</th>
                        <th scope="col">Modifier</th>
                        <th scope="col">Supprimer</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let worker of workers">
                        <td>{{worker?.firstName}}</td>
                        <td>{{worker?.lastName}}</td>
                        <td>{{worker?.email}}</td>
                        <td>{{worker?.phone}}</td>
                        <td>{{worker?.entryDate | date:'shortDate'}}</td>
                        <td>
                            <button class="action-button" (click)="editWorker(worker)"><fa-icon
                                    [icon]="faEdit"></fa-icon></button>
                        </td>
                        <td>
                            <button class="action-button" (click)="deleteWorker(worker)"> <fa-icon
                                    [icon]="faTrash"></fa-icon></button>
                        </td>
                    </tr>
                    <tr *ngIf="count == 0">
                        <td colspan="7" class="not-found-message">Pas de travailleur trouvé</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <mat-paginator #paginator class="paginator" (page)="handlePageEvent($event)" [length]="count" [pageSize]="5"
            [disabled]="false" [showFirstLastButtons]="true" [pageSizeOptions]="[5,10,20]" [hidePageSize]="false"
            [pageIndex]="0" aria-label="Select page">
        </mat-paginator>
    </div>
</div>
