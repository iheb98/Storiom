<div class="padding-page">
    <div class="row title-bloc">
        <h2 class="title">
            {{ storeId ? 'Modifier la boutique' : 'Créer votre boutique' }}
        </h2>
    </div>
    <form class="form-container" [formGroup]="form" (ngSubmit)="storeId ? edit() : save()">
        <div class="row">

            <div class="col-lg-12">

                <div class="mb-3">
                    <label for="name" class="form-label">Nom de la boutique<span class="form-error">*</span></label>
                    <input type="text" class="form-control" id="name" formControlName="name">
                    <div
                        *ngIf="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)">
                        <div *ngIf="form.controls['name'].errors.required" class="form-error">
                            Le nom est obligatoire.
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Type <span class="form-error">*</span></label>
                    <ng-select formControlName="storeType" name="storeType" id="storeType">
                        <ng-option *ngFor="let element of storeTypes" [value]="element">{{element}}</ng-option>
                    </ng-select>
                    <div
                        *ngIf="form.controls['storeType'].invalid && (form.controls['storeType'].dirty || form.controls['storeType'].touched)">
                        <div *ngIf="form.controls['storeType'].errors.required" class="form-error">
                            Le type est obligatoire.
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Téléphone</label>
                    <input type="text" class="form-control" id="phone" formControlName="phone">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Adresse mail</label>
                    <input type="text" class="form-control" id="email" formControlName="email">
                </div>
                <div class="mb-3">
                    <label for="site" class="form-label">Site web</label>
                    <input type="text" class="form-control" id="site" formControlName="site">
                </div>
                <!--<div class="mb-3">
                    <label for="country" class="form-label">Pays</label>
                    <input type="text" class="form-control" id="country" formControlName="country">
                </div>-->
                <div class="mb-3">
                    <label for="state" class="form-label">Etat</label>
                    <input type="text" class="form-control" id="state" formControlName="state">
                </div>
                <div class="mb-3">
                    <label for="city" class="form-label">Cité</label>
                    <input type="text" class="form-control" id="city" formControlName="city">
                </div>
                <!--<div class="mb-3">
                    <label for="postalCode" class="form-label">Code postal</label>
                    <input type="text" class="form-control" id="postalCode" formControlName="postalCode">
                </div>-->
                <div class="mb-3">
                    <label for="street" class="form-label">Rue</label>
                    <input type="text" class="form-control" id="street" formControlName="street">
                </div>
                <div class="mb-3">
                    <label for="logo" class="form-label">Logo</label>
                    <input #fileInput type="file" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea maxlength="50000" rows="10" resize="none" class="form-control"
                        formControlName="description" id="description">
                    </textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    <button type="submit" class="btn btn-primary" *ngIf="!storeId">Ajouter</button>
                </div>
                <div class="col-lg-12">
                    <button type="submit" class="btn btn-primary" *ngIf="storeId">Modifier</button>
                </div>
            </div>

        </div>
    </form>
</div>
