<div class="container">
    <div class="row title-bloc">
        <h2 class="title">
            Créer votre boutique
        </h2>
    </div>
    <form class="form-container" [formGroup]="form" (ngSubmit)="save()">
        <div class="row">

            <div class="col-lg-12">

                <div class="mb-3">
                    <label for="name" class="form-label">Nom <span class="form-error">*</span></label>
                    <input type="text" class="form-control" id="name" formControlName="name">
                    <div *ngIf="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)">
                        <div *ngIf="form.controls['name'].errors.required" class="form-error">
                           Le nom est obligatoire.
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="logo" class="form-label">Logo</label>
                    <input #fileInput type="file" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea maxlength="50000" rows="10" resize="none" class="form-control" formControlName="description" id="description">
                    </textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </div>
            </div>

        </div>
    </form>
</div>
