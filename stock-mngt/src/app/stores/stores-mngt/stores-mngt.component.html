<div class="page">
    <div class="page-title">
        <div>
            <h2 class="title">Liste des boutiques</h2>
        </div>
    </div>
    <div class="page-content">
        <div class="stores-list">


            <div *ngFor="let store of (stores$ | async)" class="item">
                <div class="header">
                    <div class="name">
                        {{store?.name}}
                    </div>
                    <div class="actions">
                        <button class="action-button" (click)="deleteStore(store?.id)">
                            <fa-icon [icon]="faDelete"></fa-icon>
                        </button>
                        <button class="action-button">
                            <fa-icon [icon]="faEdit"></fa-icon>
                        </button>
                    </div>
                </div>
                <div class="image-container" (click)="selectStore(store)">
                    <img src="{{store?.logo ? backend_URL +'/images/'+store?.logo  : 'assets/storeIcon.png'}}" class="image">
                </div>
            </div>

            

            <div class="item">
                <a [routerLink]="['/stores/add']" routerLinkActive="router-link-active">
                    <button class="add-button">
                        <fa-icon [icon]="faPlus"></fa-icon>
                    </button>
                </a>
            </div>
        </div>

    </div>
</div>
