<h1 mat-dialog-title>Entrez le nom du catégorie</h1>
<div mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Nom :</mat-label>
    <input matInput [(ngModel)]="categoryName">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fermer</button>
  <button mat-button [mat-dialog-close]="categoryName">{{data ? 'Modifier' : 'Ajouter'}}</button>
</div>
