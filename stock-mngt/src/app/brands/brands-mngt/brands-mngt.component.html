<ngx-loading-x [show]="loading" [spinnerColor]="'#683ab7'"></ngx-loading-x>
<div class=""  NgxLoadingXBlur [show]="loading">
    <div class="row title-bloc">
        <h2 class="title">
            Gestion des marques
        </h2>
    </div>
    <div class="row brand-bloc">

        <div class="col-6 col-sm-6 col-md-4 col-lg-2 brand-item">
            <div class="brand-container" [ngClass]="{'selected-mode':mode == 'SELECT'}" (click)="mode = 'SELECT'">
                <fa-icon [icon]="faSelect" class="icon"></fa-icon> <span class="button-label">Sélectionner</span>
            </div>
        </div>
        
        <div class="col-6 col-sm-6 col-md-4 col-lg-2 brand-item">
            <div class="brand-container" [ngClass]="{'selected-mode':mode == 'EDIT'}" (click)="mode = 'EDIT'">
                <fa-icon [icon]="faEdit" class="icon"></fa-icon> <span class="button-label">Modifier</span>

            </div>
        </div>

        <div class="col-6 col-sm-6 col-md-4 col-lg-2 brand-item">
            <div class="brand-container" [ngClass]="{'selected-mode':mode == 'DELETE'}" (click)="mode = 'DELETE'">
                <fa-icon [icon]="faTrash" class="icon"></fa-icon> <span class="button-label">Supprimer</span>
            </div>
        </div>
    </div>
    <div class="row brand-bloc">
        <div class="col-12">
            <h5 class="subbrand-name">
                Marques
            </h5>
        </div>
        <div class="col-6 col-sm-6 col-md-4 col-lg-2 brand-item" *ngFor="let item of brands">
            <div class="brand-container" [ngClass]="{'selected':item?.id == selectedBrand?.id}"
                (click)="selectBrand(item)">
                <span class="categoriy-name">{{item?.name}}</span>
            </div>
        </div>
        <div class="col-6 col-sm-6 col-md-4 col-lg-2 brand-item" *ngIf="mode == 'SELECT'">
            <div class="add-brand" (click)="addBrand()">
                <span>+</span>
            </div>
        </div>

    </div>
</div>
