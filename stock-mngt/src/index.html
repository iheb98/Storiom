<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>&#8203;</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/logo.png" id="app-favicon">
  <script>
    (function() {
      var h = location.hostname;
      var p = location.pathname;
      var platforms = ['storiom.com','www.storiom.com','localhost','127.0.0.1','161.97.186.60'];
      var isStore = p.indexOf('/preview-store/') === 0 || p.indexOf('/store-home') === 0;
      if (platforms.indexOf(h) !== -1 && !isStore) {
        document.title = 'Storiom';
      } else if (platforms.indexOf(h) === -1) {
        var link = document.getElementById('app-favicon');
        if (link) link.href = 'data:,';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .app-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #94a3b8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <app-root>
    <div class="app-loading">
      <div class="spinner"></div>
    </div>
  </app-root>
</body>

</html>
